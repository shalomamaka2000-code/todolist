<!DOCTYPE html>
<html lang="en">
  <head>
   <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="todo.css">
      
    </style>
  </head>

<div class="container">
  <body>
    <div class="header">
      <h1 class="logo">My To-Do List</h1>
      </div>
      <main>
        <div class="todo-input" id="inputarea">
            <input type="text" id="taskinput" placeholder="Enter tasks" />
            <button class=input-btn id="addtask" onclick="addtask()">Add Task</button>
        </div>
  

    <ul class="task-list" id="tasklist">
<li class="list"></li>
    </ul>
    <script src="todo.js"></script>
  </body>
  </div>
</html>
